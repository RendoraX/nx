name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/api exec tsx tests/unit/orders.service.test.ts
      - run: pnpm exec tsc -p apps/web/tsconfig.json --noEmit && pnpm exec tsc -p apps/admin/tsconfig.json --noEmit && pnpm exec tsc -p apps/delivery/tsconfig.json --noEmit
