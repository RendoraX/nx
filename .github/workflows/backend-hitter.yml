name: backend-hitter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Hit the backend API
        run: |
          curl \
            --fail-with-body \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 60 \
            "https://nx-mou5.onrender.com/api/health"
